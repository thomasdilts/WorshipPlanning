name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to login and demo.worship-planning.com
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: 85.190.100.123
          DEPLOY_PORT: 52222
          DEPLOY_USER: administrator
          SSH_PRIVATE_KEY: ${{ secrets.WORSHIP_PLANNING_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          # Write key exactly as stored in the secret (preserve newlines)
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # The live site first, then the demo, both from the same commit.
          ssh -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -i ~/.ssh/deploy_key \
              -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'EOF'
          set -euo pipefail
          for DEPLOY_PATH in /var/www/WorshipPlanning/live /var/www/WorshipPlanning/demo; do
              cd "$DEPLOY_PATH"
              git fetch --prune origin main
              git checkout main
              git reset --hard origin/main
              chmod +x scripts/deploy.sh
              SKIP_GIT=1 DEPLOY_PATH="$DEPLOY_PATH" BRANCH=main WEB_USER=www-data ./scripts/deploy.sh
          done
          sudo -n systemctl restart worshipplanning-live-queue.service || echo "WARN: could not restart the live queue worker"
          EOF
